name: Train FA Cup ML Models

on:
  workflow_dispatch:          # Manual
  schedule:
    - cron: "0 6 * * 1"       # Cada lunes a las 06:00 UTC

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train models
        env:
          THESTATSAPI_API_KEY: ${{ secrets.THESTATSAPI_API_KEY }}
        run: python train_fa_cup.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fa-cup-models-${{ github.run_number }}
          path: |
            models/
            fa_cup_dataset.csv
          retention-days: 30
