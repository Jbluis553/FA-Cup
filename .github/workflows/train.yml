name: Train and Predict FA Cup BTTS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  train-and-predict-btts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train BTTS Yes model
        env:
          THESTATSAPI_API_KEY: ${{ secrets.THESTATSAPI_API_KEY }}
        run: python train_btts_fa_cup.py

      - name: Predict upcoming BTTS matches
        env:
          THESTATSAPI_API_KEY: ${{ secrets.THESTATSAPI_API_KEY }}
          UPCOMING_MATCH_STATUS: scheduled
        run: python predict_btts_fa_cup.py

      - name: Upload model, dataset and BTTS predictions
        uses: actions/upload-artifact@v4
        with:
          name: fa-cup-btts-results-${{ github.run_number }}
          path: |
            models/
            fa_cup_dataset.csv
            fa_cup_predictions_btts.csv
          if-no-files-found: warn
          retention-days: 30
